<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aeroium</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <div id="header">
    <div id="taskbar">
      <div id="ts">
        <div id="tabs"></div>
        <button id="nt" data-i18n-title="ui.newTab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div id="win-controls">
        <button id="min" data-i18n-title="ui.minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <button id="max" data-i18n-title="ui.maximize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
        <button id="close-win" data-i18n-title="ui.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
    <div id="tb">
      <button id="bk" data-i18n-title="ui.back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <button id="fw" data-i18n-title="ui.forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      <button id="rl" data-i18n-title="ui.reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      <input id="ad" data-i18n-placeholder="ui.addressPlaceholder" placeholder="Search or enter URL (Ctrl+K)" spellcheck="false" />
      <button id="speedup" data-i18n-title="ui.videoSpeed" title="Video speed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      <button id="darkmode" data-i18n-title="ui.darkMode" title="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button id="readermode" data-i18n-title="ui.readerMode" title="Reader mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
      <button id="note" data-i18n-title="ui.note" title="Quick note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
      <button id="extensions" data-i18n-title="ui.extensions" title="Extensions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23-2.83 2.83-1.23-1.23c-.62.27-1.31.43-2.05.43v1.7h-4v-1.7c-.74 0-1.43-.16-2.05-.43l-1.23 1.23-2.83-2.83 1.23-1.23C3.16 12.43 3 11.74 3 11H1.3V7h1.7c0-.74.16-1.43.43-2.05L2.2 3.72l2.83-2.83 1.23 1.23C6.88 1.85 7.57 1.7 8.3 1.7V0h4v1.7c.74 0 1.43.16 2.05.43l1.23-1.23 2.83 2.83-1.23 1.23c.27.62.43 1.31.43 2.05h1.7v4z"/><circle cx="11" cy="9" r="2"/></svg></button>
    </div>
  </div>

  <!-- PANELLER: Artık header içinde değil, en dışta -->
  <div id="modals-layer" class="hidden">
    <div id="overlay"></div>

    <div id="ext-panel" class="modal-panel hidden">
      <div class="modal-header">
        <span data-i18n="ext.title">Extensions</span>
        <button class="modal-close" id="ext-close">✕</button>
      </div>
      <div id="ext-list"></div>
      <button id="ext-store-btn" data-i18n="ext.store">Open Chrome Web Store</button>
    </div>

    <div id="note-panel" class="modal-panel hidden">
      <div class="modal-header">
        <span data-i18n="note.title">Quick note</span>
        <button class="modal-close" id="note-close">✕</button>
      </div>
      <textarea id="note-text" data-i18n-placeholder="note.placeholder" placeholder="Write your note here..."></textarea>
      <button id="note-save" data-i18n="note.save">Save</button>
    </div>

    <div id="cmd-palette" class="modal-panel hidden">
      <input id="cmd-input" data-i18n-placeholder="cmd.placeholder" placeholder="Type a command or search..." />
      <div id="cmd-results"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="renderer.js"></script>
</body>
</html>
