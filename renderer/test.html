<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bildirim Testi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f4f6f8; 
      color: #202124; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      text-align: center;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 500px;
    }
    h1 { font-size: 24px; margin-bottom: 16px; color: #1a73e8; }
    p { font-size: 15px; line-height: 1.6; color: #5f6368; margin-bottom: 24px; }
    button {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #1557b0; }
    .hint {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bildirim Testi</h1>
    <p>Bu butona tıkladığında, Aeroium'un sağ alt köşesinde şık bir bildirim kutusu (Toast) belirmelidir. Bu sistem, web sitelerinin tarayıcı arayüzüne müdahale etmeden bildirim göndermesini sağlar.</p>
    
    <button id="notifyBtn">Aeroium Bildirimi Gönder</button>
    
    <div class="hint">
      İpucu: Sayfaya sağ tıklayarak da bildirim tetikleyebilirsin.
    </div>
  </div>

  <script>
    document.getElementById('notifyBtn').addEventListener('click', () => {
      if (window.aeroium && window.aeroium.showNotification) {
        window.aeroium.showNotification('Merhaba! Bu Aeroium tarafından gönderilen test bildirimidir.');
      } else {
        alert('Bildirim API\'si bulunamadı. Lütfen sayfayı Aeroium üzerinden açtığınızdan emin olun.');
      }
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (window.aeroium && window.aeroium.showNotification) {
        window.aeroium.showNotification('Sağ tıklama yakalandı! Bildirim sistemi başarıyla çalışıyor.');
      }
    });
  </script>
</body>
</html>
